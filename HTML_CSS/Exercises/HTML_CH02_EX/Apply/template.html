<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Template</title>
</head>
<body>
  <!--The header element describes the header area of a webpage. Business names 
  or logos in this area-->
  <header>
    <h1>My Template</h1>
  </header>
  <!--The nav element describes the navigation area of a webpage. Links are typically
  put in this area-->
  <nav>
    <p>Home &nbsp; &#9838; &nbsp;
      Lessons &nbsp; &#9838; &nbsp;
      Instructors &nbsp; &#9838; &nbsp;
      Rentals &nbsp; &#9838; &nbsp;
      Contact
    </p>
  </nav>
  <!--The main element describes the main content area of a webpage. There can only be 
  one main element per page-->
  <main>
  </main>
  <!--The footer element describes the bottom or footer area of a webpage. Contact information, 
  social media links, and copyright information are typically found here-->
  <footer>
    <p>Add contact information here</p>
    <p>&copy; Copyright 2021. All Rights Reserved.</p>
  </footer>
</body>
</html>

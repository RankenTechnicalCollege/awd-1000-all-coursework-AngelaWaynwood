        <h3>Past Technology that has shaped out future</h3>
        <figure>

          <figcaption><a href="https://www.britannica.com/technology/printing-press" target="_blank">The Printing

            even
            art.</figcaption>
        </figure>

        <figure>
          <img src="images/steam-engine.jpg" alt="steam engine">
          <figcaption><a href="https://www.britannica.com/technology/steam-engine" target="_blank">The Steam Engine</a>:

            completely changed transportation, and shifted the economy from agriculture to industrial.</figcaption>
        </figure>

        <figure>
          <img src="images/transistor.jpg" alt="transistor sitting on red background">
          <figcaption><a href="https://www.britannica.com/technology/transistor" target="_blank">The Transistor</a>:

            being used. This lead straight into the creation of smartphones, computers, and microprocessors.
          </figcaption>
        </figure>
